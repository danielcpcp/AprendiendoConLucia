<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F58CD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lucía">
<meta name="description" content="Aprendiendo con Lucía: juego para trabajar fonética, semántica, morfosintaxis y pragmática con personas con discapacidad intelectual, síndrome de Down y TEA.">
<title>Aprendiendo con Lucía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
if(window.tailwind) tailwind.config = {
  theme: { extend: {
    colors: { bg:'var(--bg)', panel:'var(--panel)', panel2:'var(--panel2)', ink:'var(--ink)', soft:'var(--soft)', line:'var(--line)', brand:'var(--brand)', 'brand-soft':'var(--brand-soft)', sun:'var(--sun)', 'sun-soft':'var(--sun-soft)', ok:'var(--ok)' },
    fontFamily: { sans:['Inter','system-ui','-apple-system','Segoe UI','Roboto','Arial','sans-serif'] }
  } },
  corePlugins: { preflight: true }
};
</script>
<style>
:root{
  --bg:#F5F7FB; --panel:#FFFFFF; --panel2:#EEF2F8; --ink:#152033; --soft:#586379; --line:#E1E6EF;
  --brand:#2F58CD; --brand-2:#2447A8; --brand-soft:#E9EFFD; --on-brand:#FFFFFF;
  --sun:#E9A21F; --sun-soft:#FFF3D6;
  --ok:#1F7A4A; --okbg:#E2F4E9; --hint:#9A6200; --hintbg:#FFF1CC; --danger:#B42318;
  --fon:#2C6C9C; --sem:#34784A; --mor:#8C6410; --pra:#7A4E8C; --inf:#B4436C; --cat:#0F7C80; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(21,32,51,.05),0 12px 32px -14px rgba(21,32,51,.20);
  --sky1:#BFE3FF; --sky2:#EAF6FF; --grass1:#93CF74; --grass2:#6DB356;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1521; --panel:#162031; --panel2:#1D2A3F; --ink:#E7ECF5; --soft:#A2ADC2; --line:#2A3850;
    --brand:#8AA6F7; --brand-2:#A6BCFA; --brand-soft:#1E2A47; --on-brand:#0E1521;
    --sun:#F2C35F; --sun-soft:#3A301C;
    --ok:#74CF9B; --okbg:#173627; --hint:#F2C265; --hintbg:#3B2F16; --danger:#F08A80;
    --fon:#7DB4DE; --sem:#7EC593; --mor:#DDB55A; --pra:#C39AD3; --inf:#F08DB0; --cat:#5CC9CC; --on-accent:#0E1521;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.6);
    --sky1:#6E93B8; --sky2:#9BB8D2; --grass1:#5E9A4A; --grass2:#4A7F3A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1521; --panel:#162031; --panel2:#1D2A3F; --ink:#E7ECF5; --soft:#A2ADC2; --line:#2A3850;
  --brand:#8AA6F7; --brand-2:#A6BCFA; --brand-soft:#1E2A47; --on-brand:#0E1521;
  --sun:#F2C35F; --sun-soft:#3A301C;
  --ok:#74CF9B; --okbg:#173627; --hint:#F2C265; --hintbg:#3B2F16; --danger:#F08A80;
  --fon:#7DB4DE; --sem:#7EC593; --mor:#DDB55A; --pra:#C39AD3; --inf:#F08DB0; --cat:#5CC9CC; --on-accent:#0E1521;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -14px rgba(0,0,0,.6);
  --sky1:#6E93B8; --sky2:#9BB8D2; --grass1:#5E9A4A; --grass2:#4A7F3A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
img,svg{max-width:100%}

/* ---------- Componentes (zona profesional) ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid transparent;transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease,border-color .15s ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn-primary{background:var(--brand);color:var(--on-brand);box-shadow:0 8px 18px -10px var(--brand)}
.btn-primary:hover{background:var(--brand-2)}
.btn-ghost{background:var(--panel);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--panel2)}
.btn-soft{background:var(--brand-soft);color:var(--brand)}
.btn-danger{background:transparent;color:var(--danger);border-color:transparent}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
.btn-lg{min-height:52px;padding:0 22px;font-size:16px;border-radius:14px}
.btn-sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;color:var(--soft)}
.iconbtn:hover{background:var(--panel2);color:var(--ink)}
.navlink{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--soft);font-weight:600;font-size:15px;width:100%;text-align:left;transition:background-color .15s,color .15s}
.navlink svg{width:20px;height:20px}
.navlink:hover{background:var(--panel2);color:var(--ink)}
.navlink.active{background:var(--brand-soft);color:var(--brand)}
.side{position:sticky;top:0;height:100vh;height:100dvh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--panel) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
@media (min-width:768px){.tabbar{display:none}}
.tab-i{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;letter-spacing:-.01em;font-weight:600;color:var(--soft);padding:6px 0;border-radius:12px;transition:color .15s}
.tab-i svg{width:24px;height:24px;transition:transform .15s}
.tab-i.active{color:var(--brand)}
.tab-i.active svg{transform:translateY(-1px)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--panel2);padding:4px;border-radius:14px}
.segopt{position:relative}
.segopt input{position:absolute;opacity:0;pointer-events:none}
.segopt span{display:inline-flex;align-items:center;justify-content:center;min-height:40px;min-width:46px;padding:0 14px;border-radius:10px;font-weight:600;font-size:14px;color:var(--soft);cursor:pointer;transition:background-color .15s,color .15s}
.segopt input:checked+span{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.segopt input:focus-visible+span{outline:2px solid var(--brand)}
.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emo-grid .segopt span{font-size:22px;min-width:0;width:100%;aspect-ratio:1;padding:0;min-height:0}
.emo-grid .segopt input:checked+span{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.color-dot{width:34px;height:34px;border-radius:50%;display:block}
.colors .segopt span{padding:3px;min-width:0;min-height:0;border-radius:50%}
.colors .segopt input:checked+span{box-shadow:0 0 0 2px var(--ink);background:transparent}
.switch{position:relative;display:inline-flex;flex:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{display:block;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:background-color .15s;cursor:pointer}
.thumb{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.switch input:checked+.track{background:var(--brand)}
.switch input:checked+.track .thumb{transform:translateX(20px)}
.switch input:focus-visible+.track{outline:2px solid var(--brand);outline-offset:2px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px 18px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.field:last-child{border-bottom:0}
.field .lbl{flex:1 1 220px;min-width:0}
.input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;font:inherit;font-size:16px;transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
textarea.input{min-height:90px;resize:vertical}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.lab{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.pill{--c:var(--brand);display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);white-space:nowrap}
.stchip{display:inline-flex;align-items:center;gap:8px;padding:5px 16px 5px 5px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:15px;min-height:46px;transition:all .15s}
.stchip:hover{border-color:var(--brand)}
.stchip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none;overflow:hidden}
.av-lg{width:52px;height:52px;font-size:28px;border-radius:16px}
.hero{background:linear-gradient(135deg,var(--brand-soft) 0%,var(--panel) 55%,var(--sun-soft) 130%);border:1px solid var(--line);border-radius:28px}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.rowbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;transition:background-color .15s}
.rowbtn:hover{background:var(--panel2)}
.chipf{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:14px;color:var(--soft);white-space:nowrap;transition:all .15s}
.chipf.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--panel2)}
.bar i{display:block;height:100%}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;max-width:min(560px,92vw);box-shadow:var(--shadow);transition:opacity .2s,transform .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:768px){.toast{bottom:28px}}
.fadein{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Modal / hoja inferior */
.modal-wrap{position:fixed;inset:0;z-index:60}
.modal-bg{position:absolute;inset:0;background:rgba(9,14,25,.52);opacity:0;transition:opacity .2s}
.modal-wrap.open .modal-bg{opacity:1}
.modal{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--panel);color:var(--ink);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(30px);opacity:0;transition:transform .22s ease,opacity .22s ease;box-shadow:var(--shadow)}
.modal-wrap.open .modal{transform:none;opacity:1}
.modal::before{content:"";display:block;width:40px;height:5px;border-radius:99px;background:var(--line);margin:8px auto 0}
@media (min-width:768px){
  .modal{left:50%;top:50%;bottom:auto;width:min(620px,92vw);max-height:86vh;border-radius:24px;transform:translate(-50%,-46%)}
  .modal::before{display:none}
  .modal-wrap.open .modal{transform:translate(-50%,-50%)}
  .modal.lg{width:min(780px,94vw)}
  .modal.sm{width:min(440px,92vw)}
}
.mhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 10px}
.mhead h2{margin:0;font-size:19px;font-weight:700}
.mbody{overflow-y:auto;padding:6px 20px 20px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.mfoot{flex:none;display:flex;gap:10px;align-items:center;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap}
.tabs{flex:none;display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabbtn{padding:12px 10px;font-weight:600;font-size:14px;color:var(--soft);border-bottom:2px solid transparent;white-space:nowrap}
.tabbtn.on{color:var(--brand);border-color:var(--brand)}
.err{color:var(--danger);font-size:14px;font-weight:600;min-height:1em}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:64px;border-radius:16px;background:var(--panel2);font-size:24px;font-weight:700}
.pindots{display:flex;justify-content:center;gap:14px;margin:6px 0 18px}
.pindots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--soft)}
.pindots i.on{background:var(--ink);border-color:var(--ink)}

/* ---------- Modo alumno (accesible) ---------- */
.player{font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;--fs:21px;font-size:var(--fs);line-height:1.4;min-height:100%;background:var(--bg);--accent:var(--brand)}
.player.fs-l{--fs:24px}
.player.fs-xl{--fs:27px}
.pwrap{max-width:1000px;margin:0 auto;padding:14px 16px 30px}
.ptop{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hold{position:relative;overflow:hidden;min-height:52px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);font-size:15px;font-weight:700;color:var(--soft);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hold .fill{position:absolute;inset:0;background:var(--brand-soft);transform-origin:left;transform:scaleX(0)}
.hold.holding .fill{transform:scaleX(1);transition:transform 1.6s linear}
.hold .rel{position:relative}
.ptitle{flex:1;font-weight:700;color:var(--accent);min-width:140px}
.tokens{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tok{width:1.45em;height:1.45em;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:.85em;background:var(--panel)}
.tok.on{border:2px solid var(--sun);background:var(--sun-soft)}
.pdots{display:flex;gap:8px;list-style:none;margin:0 0 14px;padding:0;flex-wrap:wrap}
.pdots li{width:18px;height:18px;border-radius:50%;border:3px solid var(--accent)}
.pdots li.done{background:var(--accent)}
.pdots li.now{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent)}
.pcard{background:var(--panel);border:2px solid var(--line);border-radius:26px;padding:clamp(16px,3vw,28px);box-shadow:var(--shadow)}
.question{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.question .pic{font-size:3.4em;line-height:1;flex:none}
.question p{margin:0;font-size:1.3em;font-weight:700;flex:1;line-height:1.3;min-width:0}
.listen{width:3.3em;height:3.3em;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:1em;flex:none;display:grid;place-items:center}
.listen svg{width:1.4em;height:1.4em}
.opts{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.opts.n3{grid-template-columns:repeat(3,minmax(0,1fr))}.opts.n4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opts.txt{grid-template-columns:1fr}
@media (min-width:760px){.opts.txt.n2,.opts.txt.n4{grid-template-columns:repeat(2,minmax(0,1fr))}.opts.txt.n3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.optbox{position:relative}
.opt{width:100%;min-height:6.6em;border-radius:22px;border:3px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px 12px;transition:border-color .15s,background-color .15s,opacity .2s,transform .1s}
.opt .e{font-size:2.5em;line-height:1}
.opt .t{font-size:1.05em;font-weight:700;text-align:center;line-height:1.25;overflow-wrap:anywhere}
.opt.textonly{min-height:4.4em;padding:14px 56px 14px 16px}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right::after{content:"✓";position:absolute;top:8px;left:14px;font-size:1.4em;font-weight:700;color:var(--ok)}
.opt.off{opacity:.3;background:var(--panel2)}
.opt.hint{border-color:var(--hint);background:var(--hintbg);animation:softpulse 1.8s ease-in-out infinite}
@keyframes softpulse{0%,100%{box-shadow:0 0 0 0 var(--hintbg)}50%{box-shadow:0 0 0 8px var(--hintbg)}}
.say{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--soft)}
.say svg{width:20px;height:20px}
.model{padding:12px 16px;border-radius:16px;background:var(--hintbg);font-weight:700;font-size:1.1em;margin-bottom:14px}
.line{min-height:4.4em;border:3px dashed var(--accent);border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.line:empty::before{content:"Toca las palabras en orden";color:var(--soft);font-size:.9em;padding-left:6px}
.line.right{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.bank{display:flex;flex-wrap:wrap;gap:10px;min-height:3.6em}
.word{min-height:3.2em;min-width:4.4em;padding:8px 18px;border-radius:16px;border:3px solid var(--line);background:var(--panel);font-size:1.15em;font-weight:700}
.line .word{border-color:var(--accent)}
.pactions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.pactions.left{justify-content:flex-start}
.pbtn{min-height:3.2em;padding:0 1.3em;border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1em;transition:transform .1s,opacity .15s}
.pbtn:active{transform:scale(.98)}
.pbtn.ghost{background:transparent;border:3px solid var(--accent);color:var(--accent)}
.pbtn:disabled{opacity:.35}
.feedback{min-height:3.2em;margin-top:18px;font-size:1.15em;font-weight:700;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.feedback .msg{flex:1;min-width:10em}
.feedback.good .msg{color:var(--ok)}
.feedback.try .msg{color:var(--soft)}
.feedback.hint .msg{color:var(--hint)}
.lucia-row{display:flex;gap:14px;align-items:center}
.lucia-big{width:4.4em;height:4.4em;flex:none}
.bubble{flex:1;background:var(--sun-soft);border-radius:22px;padding:14px 18px;font-weight:700;font-size:1.1em;position:relative}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-9px;border:9px solid transparent;border-right-color:var(--sun-soft);border-left:0}
.agenda{list-style:none;padding:0;margin:20px 0 6px;display:flex;flex-direction:column;gap:10px}
.ag{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;border:2px solid var(--line);background:var(--panel)}
.ag.now{border-color:var(--brand);background:var(--brand-soft)}
.ag.done{opacity:.55}
.agi{font-size:1.5em;width:1.6em;text-align:center;flex:none}
.agt{flex:1;font-weight:700}

const GEN_N = 30;
function genItems(mod, level){
  const g=GEN[mod]; if(!g) return [];
  const out=[], seen=new Set(); let tries=0;
  while(out.length<GEN_N && tries<160){ tries++; let it=null; try{ it=g(level); }catch(e){ it=null; } if(!it || seen.has(it.id) || (it.type==='choice' && it.opts.length<2)) continue; seen.add(it.id); out.push(Object.assign(it,{mod, level, gen:true})); }
  return out;
}

  const tail = (d,cx,cy,w)=>'<g>'+(an?'<animateTransform attributeName="transform" type="rotate" values="-10 '+cx+' '+cy+';14 '+cx+' '+cy+';-10 '+cx+' '+cy+'" dur="'+w+'s" repeatCount="indefinite"/>':'')+'<path d="'+d+'" stroke="'+f+'" stroke-width="9" fill="none" stroke-linecap="round"/></g>';

  if(pa==='gafas') s += '<g fill="#2C2C2A"><rect x="-17" y="'+(ey-5)+'" width="14" height="10" rx="4"/><rect x="3" y="'+(ey-5)+'" width="14" height="10" rx="4"/><rect x="-4" y="'+(ey-1)+'" width="8" height="2"/></g>';
  const hopA = g ? '<animateTransform attributeName="transform" type="translate" dur="'+AV_CYC+'s" begin="'+t1+'s" repeatCount="indefinite" values="0 0;0 0;0 -14;0 0;0 -14;0 0;0 0" keyTimes="0;0.7;0.72;0.75;0.78;0.81;1"/>' : '';

function avScene(c, o){
  o = o||{};
  const an = o.anim==null ? avAnimOn() : !!o.anim, id = ++AV_N, b = AV.BG[c.bg], hasPet = c.pet!=='ninguna', ax = hasPet ? 14 : 70;
  const label = String(o.label||'Avatar').replace(/[&<>"']/g,'');
  let s = '<svg viewBox="0 0 340 260" role="img" aria-label="'+label+'"><defs><clipPath id="sc'+id+'"><rect width="340" height="260" rx="14"/></clipPath></defs><g clip-path="url(#sc'+id+')">';
  s += '<rect width="340" height="260" fill="'+b[0]+'"/><g fill="#fff" fill-opacity=".6"><ellipse cx="290" cy="40" rx="22" ry="9"/><ellipse cx="306" cy="34" rx="14" ry="8"/></g><rect y="214" width="340" height="46" fill="'+b[1]+'"/>';
  s += '<g transform="translate('+ax+' 24)">'+avBust(c,{id:id, anim:an, greet:o.greet, t0:o.t0, name:o.name, bubble:true})+'</g>';
  if(hasPet) s += '<g transform="translate(282 254) scale(1.15)">'+avPet(c,{anim:an, greet:o.greet, t1:o.t1, mood:o.mood, bubble:true})+'</g>';
  return s+'</g></svg>';
}
function avFace(c){

function avBadgeSVG(c, o){

/* Lucía: personalizable desde Ajustes (cabecera, agenda, premios…) */
function lucia(mode){
  const c = avCfg(DB && DB.settings && DB.settings.lucia, LUCIA_DEF);
  const an = mode!=='static' && avAnimOn();
  return avBadgeSVG(c, {anim:an, greet:an && mode==='greet', t0:7, label:'Lucía'});

function avCompanion(st, mood){

/* Creador de avatar (alumno y Lucía). Modifica el objeto C en su sitio. */
function avCreator(host, C, o){
  o = o||{};
  let T = 'cuerpo';
  const tabs = [['cuerpo','Cuerpo'],['cara','Cara'],['pelo','Pelo'],['ropa','Ropa'],['extra','Extras']];
  if(o.pet!==false) tabs.push(['mascota','Mascota']);
  host.innerHTML = '<div class="avprev"></div><div class="avtabs" role="tablist" aria-label="Partes del avatar"></div><div class="avpanel"></div>'
    + '<div class="flex flex-wrap gap-2 mt-4"><button type="button" class="btn btn-ghost" data-avrnd>🎲 Al azar</button>'+(o.reset?'<button type="button" class="btn btn-ghost" data-avreset>Volver al original</button>':'')+'</div>';
  const prev = host.querySelector('.avprev'), tb = host.querySelector('.avtabs'), pn = host.querySelector('.avpanel');
  const swat = (k,list,cur,lab)=>'<div class="avsw">'+list.map((col,i)=>'<button type="button" data-k="'+k+'" data-v="'+i+'" class="'+(cur===i?'on':'')+'" aria-label="'+lab+' '+(i+1)+'" aria-pressed="'+(cur===i)+'" style="background:'+col+'"></button>').join('')+'</div>';
  const opts = (k,list,cur)=>'<div class="avgrid">'+list.map(x=>'<button type="button" class="avopt'+(cur===x[0]?' on':'')+'" data-k="'+k+'" data-v="'+x[0]+'" aria-pressed="'+(cur===x[0])+'">'+x[1]+'</button>').join('')+'</div>';
  const lb = t=>'<p class="avlab">'+t+'</p>';
  function drawPrev(){ prev.innerHTML = avScene(C, {anim:!REDUCED, greet:true, name:o.name?o.name():'', label:o.label||'Avatar', t0:1.2, t1:4}); }
  function drawPanel(){
    let h = '';
    if(T==='cuerpo') h = lb('Color de piel')+swat('skin',AV.SKIN,C.skin,'Piel')+lb('Fondo')+swat('bg',AV.BG.map(x=>x[0]),C.bg,'Fondo');
    if(T==='cara') h = lb('Color de ojos')+swat('eye',AV.EYE,C.eye,'Ojos')+lb('Expresión')+opts('ex',AV.EX,C.ex)+lb('Detalles')+opts('fx',AV.FX,C.fx);
    if(T==='pelo') h = lb('Peinado')+opts('hs',AV.HS,C.hs)+lb('Color de pelo')+swat('hc',AV.HAIR,C.hc,'Pelo');
    if(T==='ropa') h = lb('Prenda')+opts('top',AV.TS,C.top)+lb('Estampado')+opts('pt',AV.PT,C.pt)+lb('Color de la ropa')+swat('tc',AV.TOPC,C.tc,'Ropa');
    if(T==='extra') h = lb('Complemento')+opts('acc',AV.AC,C.acc);
    if(T==='mascota') h = lb('Mascota')+opts('pet',AV.PS,C.pet)+(C.pet!=='ninguna' ? lb('Color del pelaje')+swat('pc',AV.PETC,C.pc,'Pelaje')+lb('Complemento de la mascota')+opts('pa',AV.PA,C.pa) : '');
    pn.innerHTML = h;
    tb.innerHTML = tabs.map(t=>'<button type="button" role="tab" class="chipf'+(T===t[0]?' on':'')+'" data-avt="'+t[0]+'" aria-selected="'+(T===t[0])+'">'+t[1]+'</button>').join('');
  }
  function changed(){ drawPrev(); if(o.onChange) o.onChange(C); }
  host.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b || !host.contains(b)) return;
    if(b.dataset.avt){ T = b.dataset.avt; drawPanel(); return; }
    if(b.hasAttribute('data-avrnd')){ Object.assign(C, avRand()); if(o.pet===false) C.pet='ninguna'; changed(); drawPanel(); return; }
    if(b.hasAttribute('data-avreset')){ Object.assign(C, o.base||AV_DEF); changed(); drawPanel(); return; }
    if(b.dataset.k){ const k=b.dataset.k; C[k] = (k in AV_NUM) ? +b.dataset.v : b.dataset.v; changed(); drawPanel(); }
  });
  drawPrev(); drawPanel();
  return {refresh: drawPrev};
}
function mountLuciaCreator(){
  const h = $('#luciaCreator'); if(!h) return;
  const C = avCfg(DB.settings.lucia, LUCIA_DEF);
  avCreator(h, C, {pet:false, reset:true, base:LUCIA_DEF, name:()=>'Lucía', label:'Lucía',
    onChange:c=>{ DB.settings.lucia = Object.assign({}, c); save(); refreshLucia(); }});
}

/* =========================================================
   Datos (solo en este dispositivo)
   ========================================================= */
const KEY = 'aprendiendo-con-lucia-v1';
function emptyDB(){ return {version:1, students:[], custom:[], sessions:[], settings:{teacher:'', pin:'', theme:'auto', lucia:null, voice:{uri:'', pitch:1}}}; }
function loadDB(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.version===1 && Array.isArray(d.students)) return Object.assign(emptyDB(), d, {settings:Object.assign(emptyDB().settings, d.settings||{})}); }catch(e){}
  return emptyDB();
}
let DB = loadDB();
function migrate(){
  { const v = (DB.settings && DB.settings.voice) || {};
    const pt = +v.pitch;
    DB.settings.voice = {uri: typeof v.uri==='string' ? v.uri : '', pitch: (pt>=0.7 && pt<=1.3) ? pt : 1}; }
  DB.students.forEach(s=>{
    s.levels = Object.assign({fon:1,sem:1,mor:1,pra:1,inf:1,cat:1}, s.levels||{});
    s.plan = Object.assign({}, DEF_PLAN, s.plan||{});
    if(s.plan.inf==null) s.plan.inf=3; if(s.plan.cat==null) s.plan.cat=3;
    const old = s.adapt||{};
    s.adapt = Object.assign({}, DEF_ADAPT, old);
    if(!old.read) s.adapt.read = old.text===false ? 'no' : 'si';
    if(typeof s.adapt.voiceId!=='string') s.adapt.voiceId='';
    if(!Array.isArray(s.recent)) s.recent=[];
  });
}
migrate();
let storageWarned = false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ if(!storageWarned){ storageWarned=true; toast('No se pueden guardar los datos en este navegador. Exporta una copia desde Ajustes.', 6000); } }
}
function newStudent(){ return {id:uid(), name:'', avatar:'🙂', av:avCfg(avRand()), color:COLORS[0], levels:{fon:1,sem:1,mor:1,pra:1,inf:1,cat:1}, adapt:{...DEF_ADAPT}, plan:{...DEF_PLAN}, notes:'', created:Date.now()}; }
const getStudent = id => DB.students.find(s=>s.id===id);

const LV = {1:L1, 2:L2, 3:L3};
const BUILTIN = [];
[1,2,3].forEach(lv=>MOD_KEYS.forEach(m=>(LV[lv][m]||[]).forEach((it,i)=>BUILTIN.push(Object.assign({}, it, {id:`${m}-${lv}-${i}`, mod:m, level:lv, builtin:true})))));
const allItems = () => BUILTIN.concat(DB.custom);
const itemById = id => BUILTIN.find(x=>x.id===id) || DB.custom.find(x=>x.id===id);
const pool = (mod,level) => allItems().filter(x=>x.mod===mod && x.level===level).concat(genItems(mod,level));

function sessionResults(sid){ return DB.sessions.filter(s=>s.studentId===sid).sort((a,b)=>a.date-b.date).flatMap(s=>s.results.map(r=>Object.assign({date:s.date}, r))); }
function autoPct(results){ return results.length ? pct(results.filter(r=>r.help===0).length, results.length) : null; }
function planSummary(s){
  const p = {...DEF_PLAN, ...s.plan};
  const parts = MOD_KEYS.filter(m=>p[m]>0).map(m=>`${MODS[m].name} (${p[m]})`);
  if(p.mini) parts.push(p.miniGame==='azar'?'Minijuego al azar':(GAMES[p.miniGame]||GAMES.compra).name);
  return parts.length ? parts.join(' · ') : 'Sesión vacía';
}
function adaptSummary(s){
  const a = {...DEF_ADAPT, ...s.adapt};
  return [`${a.opts} opciones`, a.voice ? (a.rate<0.8?'voz lenta':a.rate<0.95?'voz media':'voz normal') : 'sin voz', a.read==='no'?'no lector':a.read==='poco'?'lectura con apoyo':null, a.music&&a.music!=='off'?'música':null, a.calm?'modo calma':null, a.tokens?`${a.tokens} fichas`:null].filter(Boolean).join(' · ');
}

/* =========================================================
   Voz, sonido, avisos y descargas
   ========================================================= */
const TTS = (()=>{
  const HAS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
  let voice=null, ok=false, warned=false, timer=null, dog=null, unlocked=false;
  const REGION = {ES:'España', MX:'México', US:'EE. UU.', AR:'Argentina', CO:'Colombia', CL:'Chile', PE:'Perú', VE:'Venezuela', UY:'Uruguay', CU:'Cuba', '419':'Latinoamérica'};
  function esVoices(){
    if(!HAS) return [];
    try{ return (speechSynthesis.getVoices()||[]).filter(v=>v.lang && v.lang.replace('_','-').toLowerCase().startsWith('es')); }catch(e){ return []; }
  }
  const vid = v => v.voiceURI || v.name;
  function voiceList(){
    return esVoices().map(v=>{
      const reg = (v.lang.replace('_','-').split('-')[1]||'').toUpperCase();
      return {id:vid(v), name:v.name, label:v.name+' · '+(REGION[reg]||reg||'español')};
    }).sort((a,b)=>a.label.localeCompare(b.label,'es'));
  }
  function findVoice(id){ return id ? (esVoices().find(v=>vid(v)===id) || null) : null; }
  function pickVoice(){
    if(!HAS) return;
    try{
      const es = esVoices();
      const isES = v=>/^es-es/i.test(v.lang.replace('_','-'));
      voice = es.find(v=>isES(v)&&v.localService) || es.find(isES) || es.find(v=>v.localService) || es[0] || null;
    }catch(e){ voice=null; }
  }
  function onVoices(){ pickVoice(); try{ refreshVoiceSelects(); }catch(e){} }
  if(HAS){ pickVoice(); try{ speechSynthesis.addEventListener('voiceschanged', onVoices); }catch(e){ speechSynthesis.onvoiceschanged = onVoices; } }
  /* Voz elegida: la del alumno si la tiene; si no, la general; si no existe en este aparato, la automática. */
  function resolve(own){
    const cur = (typeof P!=='undefined' && P && P.a) ? P.a.voiceId : '';
    return findVoice(own!=null ? own : cur) || findVoice(DB.settings.voice.uri) || voice;
  }
  function unlock(){ if(unlocked||!HAS) return; unlocked=true; try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='es-ES'; speechSynthesis.speak(u); }catch(e){} }
  function warn(){ if(warned) return; warned=true; toast('No se oye la voz. Revisa el volumen y el modo silencio. En Ajustes puedes probarla.', 7000); }
  function speak(text, rate, onEnd, own){
    let fired=false; const fire=()=>{ if(fired) return; fired=true; if(onEnd) onEnd(); };
    if(!text){ if(onEnd) setTimeout(fire,0); return; }
    if(!HAS){ warn(); if(onEnd) setTimeout(fire,300); return; }
    try{
      if(!voice) pickVoice();
      const ss = speechSynthesis, u = new SpeechSynthesisUtterance(text), vz = resolve(own);
      if(vz){ u.voice=vz; u.lang=vz.lang; } else u.lang='es-ES';
      u.rate = rate||0.9; u.pitch = DB.settings.voice.pitch || 1; u.volume=1;
      let started=false, ducked=false;
      const undo=()=>{ if(ducked){ ducked=false; try{ MUSIC.duck(false); }catch(_){} } };
      u.onstart = ()=>{ ok=true; started=true; clearTimeout(dog); if(!ducked){ ducked=true; try{ MUSIC.duck(true); }catch(_){} } };
      u.onend = ()=>{ undo(); fire(); };
      u.onerror = e=>{ undo(); if(e && e.error!=='interrupted' && e.error!=='canceled' && !ok) warn(); fire(); };
      if(onEnd){ setTimeout(()=>{ if(!started) fire(); }, 3500); setTimeout(fire, 4000 + text.length*180); }
      clearTimeout(dog); if(!ok) dog=setTimeout(()=>{ if(!ok) warn(); },3000);
      clearTimeout(timer);
      if(ss.speaking||ss.pending){ ss.cancel(); timer=setTimeout(()=>{ try{ ss.resume(); ss.speak(u); }catch(e){} },120); }
      else { try{ ss.resume(); }catch(e){} ss.speak(u); }
    }catch(e){ warn(); if(onEnd) setTimeout(fire,300); }
  }
  function stop(){ if(HAS){ try{ clearTimeout(timer); speechSynthesis.cancel(); }catch(e){} } }
  function status(){
    if(!HAS) return 'Este navegador no tiene síntesis de voz. Prueba con Safari (iPad) o Chrome (Android).';
    pickVoice();
    const sel = findVoice(DB.settings.voice.uri), vz = sel || voice;
    if(!vz) return 'No hay una voz en español instalada. Se usará la voz disponible.';
    const extra = (DB.settings.voice.uri && !sel) ? ' La voz que elegiste no está en este dispositivo; se usa otra.' : '';
    return `Voz en uso: ${vz.name} (${vz.lang}).${extra}`;
  }

})();

let actx = null;
function chime(){
  if(!P || P.a.calm || !P.a.sfx) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime;
    [523.25,659.25].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*.13); g.gain.exponentialRampToValueAtTime(0.1,t+i*.13+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*.13+.35);
      o.connect(g); g.connect(actx.destination); o.start(t+i*.13); o.stop(t+i*.13+.4);
    });
  }catch(e){}
}

async function saveFile(filename, data){
  if(DL){
    try{ await DL.save({filename, data}); toast('Archivo listo.'); }
    catch(e){ if(e && e.code==='declined') return; if(e && e.code==='rate_limited'){ toast('Espera un momento y vuelve a intentarlo.'); return; } copyFallback(filename, data); }
    return;
  }
  if(!window.claude){
    try{
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'})); a.download=filename;
      document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },800); return;
    }catch(e){}
  }
  copyFallback(filename, data);
}

  const paint=()=>$$('#pd i',m).forEach((d,i)=>d.classList.toggle('on',i<val.length));
  $$('[data-k]',m).forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;

  });

function fileToPicto(file, max=220){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*k)); c.height=Math.max(1,Math.round(im.height*k)); c.getContext('2d').drawImage(im,0,0,c.width,c.height); let url=c.toDataURL('image/webp',0.85); if(!url.startsWith('data:image/webp')) url=c.toDataURL('image/png'); res(url); }; im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function filteredItems(){
  const f=S.actF, q=f.q.trim().toLowerCase();
  return allItems().filter(x=>(f.mod==='all'||x.mod===f.mod)&&(f.level==='all'||x.level===+f.level)&&(!f.own||!x.builtin)&&(!q||(x.q+' '+(x.opts||[]).map(o=>o[1]).join(' ')+' '+(x.words||[]).join(' ')).toLowerCase().includes(q)));

    if(!it.q){ err.textContent='Escribe la pregunta.'; return; }
    if(it.type==='choice'){
      const rows=[0,1,2,3].map(i=>({i, e:(d.get('oe'+i)||'').toString().trim(), t:(d.get('ot'+i)||'').toString().trim()}));
      const filled=rows.filter(r=>r.t);
      const ai=+d.get('a');
      if(filled.length<2){ err.textContent='Escribe al menos dos respuestas.'; return; }
      if(!filled.find(r=>r.i===ai)){ err.textContent='Marca como correcta una respuesta que tenga texto.'; return; }
      it.opts=filled.map(r=>oImgs[r.i]?[r.e,r.t,oImgs[r.i]]:[r.e,r.t]); it.a=filled.findIndex(r=>r.i===ai);
      if(filled.some(r=>!r.e && !oImgs[r.i])) it.text=true;
    } else {
      it.words=(d.get('words')||'').toString().trim().split(/\s+/).filter(Boolean);
      if(it.words.length<2){ err.textContent='La frase necesita al menos dos palabras.'; return; }
    }
    if(editing) Object.keys(editing).forEach(k=>delete editing[k]), Object.assign(editing,it); else DB.custom.push(it);
    save(); closeModal(); render(); toast(editing?'Actividad actualizada':'Actividad creada');
  };
}

function lineChart(points){
  if(points.length<2) return `<p class="text-sm text-soft py-6 text-center">Con dos sesiones o más verás aquí la evolución.</p>`;
  const W=640,H=210,px=38,py=22, n=points.length;
  const X=i=>px+i*(W-px-16)/(n-1), Y=v=>H-py-(v/100)*(H-py*2);
  const grid=[0,50,100].map(v=>`<line x1="${px}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="${v?'4 4':''}"/><text x="${px-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--soft)">${v}%</text>`).join('');
  const pts=points.map((p,i)=>`${X(i)},${Y(p.v)}`).join(' ');
  const area=`${X(0)},${Y(0)} ${pts} ${X(n-1)},${Y(0)}`;
  const every = Math.ceil(n/6);
  return `<svg viewBox="0 0 ${W} ${H+18}" class="w-full h-auto" role="img" aria-label="Evolución de la autonomía por sesión">
    ${grid}<polygon points="${area}" fill="var(--brand)" opacity=".08"/><polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>
    ${points.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4.5" fill="var(--panel)" stroke="var(--brand)" stroke-width="2.5"><title>${p.l}: ${p.v}%</title></circle>${i%every===0||i===n-1?`<text x="${X(i)}" y="${H+12}" text-anchor="middle" font-size="11" fill="var(--soft)">${p.l}</text>`:''}`).join('')}
  </svg>`;
}

function csvFor(students){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const help=['Autónoma','Con una pista','Con modelado'];
  const rows=[['Fecha','Alumno','Dimensión','Nivel','Actividad','Resultado','Intentos'].map(q).join(';')];
  DB.sessions.filter(x=>students.includes(x.studentId)).sort((a,b)=>a.date-b.date).forEach(x=>{
    const st=getStudent(x.studentId);
    x.results.forEach(r=>{ const it=itemById(r.itemId); rows.push([new Date(x.date).toLocaleString('es-ES'), st?st.name:'', MODS[r.mod]?MODS[r.mod].sub:r.mod, r.level, it?it.q:(r.q||r.itemId), help[r.help], r.tries].map(q).join(';')); });
    gamesOf(x).forEach(g=>rows.push([new Date(x.date).toLocaleString('es-ES'), st?st.name:'', 'Minijuego: '+GAMES[g.game].name, g.level, `${g.rounds} rondas`, `${g.ok} a la primera`, ''].map(q).join(';')));
  });
  return '\uFEFF'+rows.join('\r\n');
}

function adaptOptions(it, n){
  const idx=it.opts.map((_,i)=>i);
  if(it.optsAll || it.opts.length<=n) return it.fixed ? idx : shuffle(idx);
  const keep=[it.a, ...shuffle(idx.filter(i=>i!==it.a)).slice(0,n-1)];
  return it.fixed ? keep.sort((x,y)=>x-y) : shuffle(keep);
}
function sayP(text, onEnd){ if(P && P.a.voice) TTS.speak(text, P.a.rate, onEnd); else if(onEnd) setTimeout(onEnd, 500); }
const picHTML = (it, cls='') => it.img ? `<img src="${esc(it.img)}" alt="" class="qimg ${cls}">` : esc(it.pic||'');
const optPic = o => o[2] ? `<img src="${esc(o[2])}" alt="" class="oimg">` : (o[0] ? esc(o[0]) : '');

function pickItems(st, mod, lv, n, a){
  let all = pool(mod, lv);
  if(a.read==='no') all = all.filter(x=>x.type!=='order' || (x.wpics && x.wpics.some(Boolean)));
  const recent = new Set((st.recent||[]).slice(-120));
  const fresh = shuffle(all.filter(x=>!recent.has(x.id))), old = shuffle(all.filter(x=>recent.has(x.id)));
  return fresh.concat(old).slice(0,n);
}
function markSeen(id){ if(!P || P.guest || !id) return; const st=P.st; st.recent=(st.recent||[]).filter(x=>x!==id); st.recent.push(id); if(st.recent.length>150) st.recent=st.recent.slice(-150); }

function startSession(studentId, guest){
  const st = guest ? Object.assign(newStudent(), {id:'guest', name:'invitado', avatar:'🙂', av:null}) : getStudent(studentId);
  if(!st) return;
  closeModal();
  const a={...DEF_ADAPT, ...st.adapt}, plan={...DEF_PLAN, ...st.plan};

function readOptions(){

function solveQuestion(extraSay){

/* ---------- Música de fondo (generada, sin archivos externos) ---------- */
const MUSIC = (()=>{
  let ctx=null, master=null, timer=null, on=false, step=0, style='calm', duckN=0, muted=false;
  const scales={calm:[261.63,293.66,329.63,392.00,440.00,523.25], happy:[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25]};
  const chords=[[130.81,164.81,196.00],[110.00,130.81,164.81],[87.31,110.00,130.81],[98.00,123.47,146.83]];
  const base=()=> style==='happy'?0.5:0.42;
  function level(){ return muted?0.0001:(duckN>0?base()*0.3:base()); }
  function apply(){ if(master&&ctx) master.gain.setTargetAtTime(level(), ctx.currentTime, 0.15); }
  function note(f,t,dur,vol,type){ const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.06); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.1); }
  function tick(){
    if(!on) return;
    const beat = style==='happy'?0.36:0.7, t=ctx.currentTime+0.05;
    if(step%8===0) chords[Math.floor(step/8)%4].forEach(f=>note(f,t,beat*8.2,0.045,'triangle'));
    if(style==='happy' || step%2===0){ const sc=scales[style]; note(pick(sc), t, beat*(style==='happy'?1.2:2.2), style==='happy'?0.05:0.04, 'sine'); }
    step++; timer=setTimeout(tick, beat*1000);
  }
  function start(st){
    try{
      duckN=0; muted=false;
      style = st==='happy'?'happy':'calm';
      ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended') ctx.resume();
      if(!master){ master=ctx.createGain(); master.connect(ctx.destination); }
      master.gain.value=0.0001; apply();
      if(!on){ on=true; step=0; tick(); }
    }catch(e){}
  }
  function stop(){ on=false; clearTimeout(timer); if(master&&ctx) master.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.2); }
  return {start, stop, duck(b){ duckN=Math.max(0,duckN+(b?1:-1)); apply(); }, mute(b){ muted=!!b; apply(); }, get on(){ return on; }};
})();

function listenBtn(){ return P.a.voice ? `<button class="listen" data-act="g" data-op="listen" aria-label="Escuchar">${ic('speaker')}</button>` : ''; }
function qhead(pic, text, sub){ return `<div class="question"><div class="pic" aria-hidden="true">${pic}</div><p>${esc(text)}${sub?`<br><span style="color:var(--soft);font-size:.85em">${esc(sub)}</span>`:''}</p>${listenBtn()}</div>`; }
function choiceGrid(M, items){
  const txt = items.some(o=>!o.e);
  return `<div class="opts n${items.length}${txt?' txt':''}">${items.map((o,i)=>{
    const cls=['opt', !o.e?'textonly':'', M.off.includes(i)?'off':'', M.solved&&i===M.ans?'right':'', M.hint&&!M.solved&&i===M.ans?'hint':''].join(' ');
    return `<div class="optbox"><button class="${cls}" data-act="g" data-op="opt" data-i="${i}" aria-label="${esc(o.t)}">${o.e?`<span class="e" aria-hidden="true">${o.e}</span>`:''}<span class="t">${esc(o.t)}</span></button>${P.a.voice?`<button class="say" data-act="p-say" data-t="${esc(o.t)}" aria-label="Escuchar: ${esc(o.t)}">${ic('speaker')}</button>`:''}</div>`; }).join('')}</div>`;
}
function resetRound(M){ M.errors=0; M.hint=false; M.solved=false; M.fb=''; M.fbType=''; M.off=[]; }
function miniWin(o={}){
  const M=P.m; M.solved=true; M.rec.rounds++;
  const ok = o.ok!=null ? o.ok : M.errors===0;
  if(ok) M.rec.ok++;
  if(P.a.tokens) P.tokens=Math.min(P.a.tokens,P.tokens+1);
  const p=pick(PRAISE); M.fb='✓ '+p; M.fbType='good'; P.mood='hop';
  renderPlayer(); chime();
  setTimeout(()=>sayP((o.say?o.say+'. ':'')+p), P.a.calm||!P.a.sfx?0:350);
}
function miniFail(o){
  const M=P.m; M.errors++;
  if(P.a.helpAfter>0 && M.errors>=P.a.helpAfter) M.hint=true;
  M.fb = M.hint ? o.h : o.t; M.fbType = M.hint ? 'hint' : 'try'; P.mood='tilt';
  renderPlayer(); sayP(M.hint ? (o.sh||o.h) : (o.st||o.t));
}
function optPick(M, i, winSay){
  if(M.solved || M.off.includes(i)) return;
  if(i===M.ans) miniWin({say:winSay});
  else { M.off.push(i); miniFail({t:'Prueba otra vez.', h:'Mira. Es esta.'}); }
}
function pickUnused(M, list){ const free=list.map((_,i)=>i).filter(i=>!M.used.includes(i)); const i=free.length?pick(free):pick(list.map((_,k)=>k)); M.used.push(i); return list[i]; }

/* La compra de Lucía */
GAMES.compra.round = M=>{
  const mass=SHOP.filter(x=>!x.p), count=SHOP.filter(x=>x.p), lv=M.level;
  let target;
  if(lv===1) target=[{x:pick(mass),n:1}];
  else if(lv===2) target=shuffle(mass).slice(0,2).map(x=>({x,n:1}));
  else target=[{x:pick(count),n:2+Math.floor(Math.random()*2)}].concat(shuffle(mass).slice(0,2).map(x=>({x,n:1})));
  const names=target.map(t=>t.n>1?`${NUMS[t.n]} ${t.x.p}`:t.x.n);
  M.say='Necesito '+(names.length>1?names.slice(0,-1).join(', ')+' y '+names[names.length-1]:names[0])+'.';
  M.target=target;
  M.shelf=shuffle(target.map(t=>t.x).concat(shuffle(SHOP.filter(x=>!target.find(t=>t.x===x))).slice(0,(lv===1?6:8)-target.length)));
  M.basket={}; M.showText=!(lv===3 && P.a.voice);
};
GAMES.compra.view = M=>{
  const basket=Object.entries(M.basket).filter(([,n])=>n>0).map(([i,n])=>{ const x=SHOP[i]; return `<button class="bitem" data-act="g" data-op="remove" data-i="${i}" aria-label="Quitar ${esc(x.n)}"><span class="e">${x.e}</span>${n>1?`× ${n}`:esc(x.n)}</button>`; }).join('');
  return `<div class="lucia-row"><div class="lucia-big">${lucia()}</div><div class="bubble">${M.showText?esc(M.say):'🔊 Escucha lo que necesito'}</div>${listenBtn()}</div>
    <div class="basket" aria-label="Cesta">${basket}</div>
    <p style="margin:0 0 12px;color:var(--soft);font-size:.85em">Toca un producto para meterlo en la cesta. Toca la cesta para sacarlo.</p>
    <div class="shelf">${M.shelf.map(x=>{ const i=SHOP.indexOf(x), h=M.hint&&!M.solved&&M.target.find(t=>t.x===x); return `<button class="prod ${h?'hint':''}" data-act="g" data-op="add" data-i="${i}" ${M.solved?'disabled':''}><span class="e" aria-hidden="true">${x.e}</span><span class="t">${esc(x.n)}</span></button>`; }).join('')}</div>`;
};
GAMES.compra.footer = M=>`<button class="pbtn" data-act="g" data-op="check" ${Object.values(M.basket).some(n=>n>0)?'':'disabled'}>🧺 Ya está</button>`;
GAMES.compra.act = (M,op,el)=>{
  const i=+el.dataset.i;
  if(op==='add'){ M.basket[i]=(M.basket[i]||0)+1; M.fb=''; M.fbType=''; renderPlayer(); sayP(SHOP[i].n); }
  else if(op==='remove'){ M.basket[i]=Math.max(0,(M.basket[i]||0)-1); renderPlayer(); }
  else if(op==='check'){
    const ok = M.target.every(t=>(M.basket[SHOP.indexOf(t.x)]||0)===t.n) && Object.entries(M.basket).every(([k,n])=>n===0||M.target.find(t=>SHOP.indexOf(t.x)===+k));
    M.showText=true;
    if(ok) miniWin({}); else miniFail({t:'Revisa la cesta. Escucha otra vez.', h:'Mira los productos marcados.', st:'Revisa la cesta. '+M.say, sh:'Mira los productos marcados. '+M.say});
  }
};

/* Parejas */
GAMES.parejas.round = M=>{
  const n={1:3,2:4,3:6}[M.level];
  M.words=shuffle(MEMO).slice(0,n);
  M.cards=shuffle(M.words.flatMap((w,k)=>[{k,face:'pic'},{k,face:M.level===1?'pic':'word'}])).map(c=>Object.assign(c,{up:false,done:false}));
  M.open=[]; M.lock=false;
  M.say = M.level===1 ? 'Busca las parejas de dibujos iguales.' : 'Busca cada dibujo con su palabra.';
};
GAMES.parejas.view = M=>{
  const cols = M.cards.length<=6 ? 3 : 4;
  return qhead('🃏', M.level===1?'Busca las parejas iguales.':'Une cada dibujo con su palabra.') +
    `<div class="memgrid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${M.cards.map((c,i)=>{
      const [e,t]=M.words[c.k], show=c.up||c.done;
      const face = c.face==='pic' ? `<span class="e">${e}</span>${M.level===1?`<span class="t">${esc(t)}</span>`:''}` : `<span class="t big">${esc(t)}</span>`;
      return `<button class="mcard ${show?'up':''} ${c.done?'done':''}" data-act="g" data-op="flip" data-i="${i}" aria-label="${show?esc(t):'Carta boca abajo'}">${show?face:'<span class="back">?</span>'}</button>`; }).join('')}</div>`;
};
GAMES.parejas.act = (M,op,el)=>{
  if(op!=='flip' || M.lock) return;
  const i=+el.dataset.i, c=M.cards[i];
  if(c.up||c.done) return;
  c.up=true; M.open.push(i); sayP(M.words[c.k][1]);
  if(M.open.length<2){ M.fb=''; M.fbType=''; renderPlayer(); return; }
  const [a,b]=M.open.map(j=>M.cards[j]); M.open=[];
  if(a.k===b.k){
    a.done=b.done=true;
    if(M.cards.every(x=>x.done)) miniWin({ok:M.errors<=Math.ceil(M.words.length/2), say:'Has encontrado todas las parejas'});
    else { M.fb='¡Pareja!'; M.fbType='good'; renderPlayer(); chime(); }
  } else {
    M.errors++; M.lock=true; M.fb='No son pareja. Recuerda dónde están.'; M.fbType='try'; renderPlayer();
    setTimeout(()=>{ if(!P||P.m!==M) return; a.up=b.up=false; M.lock=false; M.fb=''; M.fbType=''; renderPlayer(); }, 1500);
  }
};

/* Paso a paso */
GAMES.pasos.round = M=>{
  M.seq=pickUnused(M, SEQS[M.level]);
  const n=M.seq.s.length; let bank=shuffle(M.seq.s.map((_,i)=>i));
  if(bank.every((v,k)=>v===k)) bank.reverse();
  M.bank=bank; M.slots=Array(n).fill(null); M.locked=[];
  M.say='Ordena los pasos: '+M.seq.t.toLowerCase()+'.';
};
GAMES.pasos.view = M=>{
  const s=M.seq.s, next=M.slots.findIndex((v,k)=>!M.locked.includes(k));
  const stepBtn=(i,op,extra='')=>`<button class="stepc ${extra}" data-act="g" data-op="${op}" data-i="${i}"><span class="e" aria-hidden="true">${s[i][0]}</span><span>${esc(s[i][1])}</span></button>`;
  return qhead(M.seq.p, M.seq.t, 'Toca los pasos en orden.') +
    `<div class="slots">${M.slots.map((v,k)=>`<div class="slot ${M.locked.includes(k)||M.solved?'ok':''}"><span class="n">${k+1}</span>${v==null?'<span style="color:var(--soft)">…</span>':stepBtn(v,'unplace')}</div>`).join('')}</div>
    <div class="sbank">${M.bank.map(i=>stepBtn(i,'place', M.hint&&!M.solved&&i===next?'hint':'')).join('')}</div>`;
};
GAMES.pasos.footer = M=>`<button class="pbtn" data-act="g" data-op="check" ${M.slots.every(v=>v!=null)?'':'disabled'}>Comprobar</button>`;
GAMES.pasos.act = (M,op,el)=>{
  const i=+el.dataset.i;
  if(op==='place'){ const k=M.slots.indexOf(null); if(k<0) return; M.slots[k]=i; M.bank=M.bank.filter(x=>x!==i); M.fb=''; renderPlayer(); sayP(M.seq.s[i][1]); }
  else if(op==='unplace'){ const k=M.slots.indexOf(i); if(k<0||M.locked.includes(k)) return; M.slots[k]=null; M.bank.push(i); renderPlayer(); }
  else if(op==='check'){
    if(M.slots.every((v,k)=>v===k)){
      const st=M.seq.s.map(x=>x[1].charAt(0).toLowerCase()+x[1].slice(1));
      const story = st.map((x,k)=> k===0?`Primero, ${x}`: k===st.length-1?`Al final, ${x}`:`Después, ${x}`).join('. ');
      miniWin({say:story});
    } else {
      M.slots.forEach((v,k)=>{ if(v===k){ if(!M.locked.includes(k)) M.locked.push(k); } else if(v!=null){ M.bank.push(v); M.slots[k]=null; } });
      miniFail({t:'Los pasos en verde están bien. Revisa los demás.', h:'Mira el paso marcado: va en el primer hueco libre.'});
    }
  }
};

/* ¿Dónde está? */
GAMES.donde.round = M=>{
  const keys=POS_LV[M.level];
  M.obj=pick(OBJS); M.pos=pick(keys); M.cell=null;
  M.type = M.level===3 && Math.random()<0.5 ? 'where' : 'place';
  if(M.type==='where'){
    const n=Math.max(2,Math.min(P.a.opts,keys.length));
    M.opts=shuffle([M.pos, ...shuffle(keys.filter(k=>k!==M.pos)).slice(0,n-1)]);
    M.ans=M.opts.indexOf(M.pos);
    M.say=`¿Dónde está ${M.obj[1]}?`;
  } else M.say=`Pon ${M.obj[1]} ${POS[M.pos].t}.`;
};
GAMES.donde.view = M=>{
  const good=POS[M.pos].cells, shown = M.type==='where' ? good[0] : M.cell;
  const cells=[0,1,2,3,4,5,6,7,8].map(c=>{
    const isT=[1,3,4,5,7].includes(c), hint=M.type==='place'&&M.hint&&!M.solved&&good.includes(c);
    const obj = shown===c ? `<span class="${c===4?'inbox':''}">${M.obj[0]}</span>` : '';
    if(c===4){ const inner=`<span>📦</span>${obj}`; return M.type==='place' ? `<button class="cell box t ${hint?'hint':''} ${M.solved&&shown===4?'okc':''}" data-act="g" data-op="cell" data-c="4" aria-label="Dentro de la caja">${inner}</button>` : `<div class="cell box">${inner}</div>`; }
    if(!isT) return `<div class="cell"></div>`;
    return M.type==='place' ? `<button class="cell t ${hint?'hint':''} ${M.solved&&shown===c?'okc':''}" data-act="g" data-op="cell" data-c="${c}" aria-label="${esc({1:'Encima',7:'Debajo',3:'A la izquierda',5:'A la derecha'}[c])}">${obj}</button>` : `<div class="cell t">${obj}</div>`;
  }).join('');
  return qhead(M.obj[0], M.say) + `<div class="scene">${cells}</div>` +
    (M.type==='where' ? `<div style="margin-top:18px">${choiceGrid(M, M.opts.map(k=>({e:'',t:POS[k].t.charAt(0).toUpperCase()+POS[k].t.slice(1)})))}</div>` : '');
};
GAMES.donde.act = (M,op,el)=>{
  const phrase=`${M.obj[1].charAt(0).toUpperCase()+M.obj[1].slice(1)} está ${POS[M.pos].t}`;
  if(op==='cell'){
    if(M.solved) return;
    const c=+el.dataset.c;
    if(POS[M.pos].cells.includes(c)){ M.cell=c; miniWin({say:phrase}); }
    else miniFail({t:'Ahí no. Prueba otra vez.', h:'Mira el sitio marcado.', st:'Prueba otra vez. '+M.say, sh:'Mira. Es aquí.'});
  } else if(op==='opt') optPick(M, +el.dataset.i, phrase);
};

/* ¿Cómo se siente? */
GAMES.emociones.round = M=>{
  const it=pickUnused(M, EMO_SIT[M.level]), set=EMO_SET[M.level];
  M.it=it;
  const n=Math.max(2,Math.min(P.a.opts,set.length));
  M.keys=shuffle([it[2], ...shuffle(set.filter(k=>k!==it[2])).slice(0,n-1)]);
  M.ans=M.keys.indexOf(it[2]);
  M.say = M.level===1 ? 'Mira la cara. ¿Qué siente?' : it[1]+' ¿Qué siente?';
};
GAMES.emociones.view = M=>{
  const faces = M.level>1;
  return qhead(M.it[0], M.level===1?'Mira la cara. ¿Qué siente?':M.it[1], M.level===1?'':'¿Qué siente?') +
    choiceGrid(M, M.keys.map(k=>({e:faces?EMO[k][0]:'', t:EMO[k][1].charAt(0).toUpperCase()+EMO[k][1].slice(1)})));
};

function raceCustomWords(){
  return String(DB.settings.raceWords||'').split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(\p{Extended_Pictographic}[\uFE0F\u200D\p{Extended_Pictographic}]*)\s*(.*)$/u);
    return m && m[2] ? [m[1], m[2]] : ['⭐', l];
  });
}
const normTxt = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
const simTxt = (a,b)=> 1 - lev(a,b)/Math.max(a.length,b.length,1);
function speechMatches(target, alts, mode){
  const t=normTxt(target); if(!t) return false;
  const tt=t.split(' ');
  for(const alt of alts){
    const a=normTxt(alt); if(!a) continue;
    if(a===t || (' '+a+' ').includes(' '+t+' ')) return true;
    if(mode==='exact') continue;
    const at=a.split(' ');
    const avg = tt.reduce((s,w)=>s+Math.max(0,...at.map(x=>simTxt(w,x))),0)/tt.length;
    if(avg>=0.6 || simTxt(t,a)>=0.6) return true;
    if(tt.length===1 && t.length>=3 && at.some(x=>x.slice(0,2)===t.slice(0,2) && Math.abs(x.length-t.length)<=3)) return true;
  }
  return false;
}

const MIC = (()=>{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  let stream=null, ctx=null, an=null, src=null, raf=null, rec=null;
  const hasGUM = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  async function open(){ if(stream) return stream; if(!hasGUM) throw new Error('nomic'); stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); return stream; }
  function meter(cb){
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    src=ctx.createMediaStreamSource(stream); an=ctx.createAnalyser(); an.fftSize=1024; src.connect(an);
    const buf=new Uint8Array(an.fftSize);
    const tick=()=>{ if(!an) return; an.getByteTimeDomainData(buf); let s=0; for(let i=0;i<buf.length;i++){ const x=(buf[i]-128)/128; s+=x*x; } cb(Math.min(1,Math.sqrt(s/buf.length)*5)); raf=requestAnimationFrame(tick); };
    tick();
  }
  function stopMeter(){ cancelAnimationFrame(raf); raf=null; try{ src&&src.disconnect(); }catch(e){} src=null; an=null; }
  function stopRec(){ if(rec){ const r=rec; rec=null; try{ r.onend=null; r.onresult=null; r.onerror=null; r.abort(); }catch(e){} } }
  function stopAll(){ stopMeter(); stopRec(); if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
  return {SR, hasGUM, open, meter, stopMeter, stopRec, stopAll, setRec:r=>{rec=r;}};
})();

function raceT(M, fn, ms){ const id=setTimeout(()=>{ M.timers=M.timers.filter(x=>x!==id); if(P && P.m===M) fn(); }, ms); M.timers.push(id); }
function raceCleanup(M){ if(M && M.timers){ M.timers.forEach(clearTimeout); M.timers=[]; } MIC.stopAll(); try{ MUSIC.mute(false); }catch(_){} if(M) M.listening=false; }

function raceCard(M){
  const n=RACE_N;
  if(M.phase==='run'||M.phase==='jump') return `<div class="pcard rcard"><div class="rrun"><span style="font-size:1.6em">💨</span><b>¡Corre!</b><span style="color:var(--soft)">Obstáculo ${Math.min(M.k+1,n)} de ${n}</span></div></div>`;
  if(M.phase==='done') return `<div class="pcard rcard center"><div style="font-size:2.4em">🏆</div><h2 style="margin:6px 0 4px;font-size:1.5em">¡Has llegado a la meta!</h2><p style="margin:0;color:var(--soft)">${M.words.filter(w=>w.help===0).length} de ${n} palabras a la primera</p>
    <div class="pactions"><button class="pbtn" data-act="m-next" id="nextb">Terminar</button></div></div>`;
  const [e,w]=M.items[M.k];
  const manual = M.mode==='manual';
  const status = M.status || (manual ? 'Di la palabra en voz alta.' : M.mode==='detect' ? 'Toca el micrófono y di la palabra.' : 'Toca el micrófono y di la palabra.');
  return `<div class="pcard rcard">
    <div class="rword"><span class="e" aria-hidden="true">${e}</span><span class="w">${esc(w)}</span>${P.a.voice?`<button class="listen" data-act="g" data-op="hear" aria-label="Escuchar la palabra">${ic('speaker')}</button>`:''}</div>
    <div class="rmicrow">
      ${manual?'':`<button class="rmic ${M.listening?'on':''}" data-act="g" data-op="mic" aria-label="${M.listening?'Parar el micrófono':'Hablar'}">🎤</button>`}
      <div class="rinfo"><div class="rstatus ${M.statusType||''}">${esc(status)}</div>${M.mode==='detect'&&!manual?`<div class="rlevel"><i id="rlevel"></i></div>`:''}${M.heard?`<div class="rheard">Lucía ha oído: «${esc(M.heard)}»</div>`:''}</div>
    </div>
    <div class="rfoot"><button class="rval" data-act="g" data-op="validate">✓ Bien dicho <span>(profesional)</span></button></div>
  </div>`;
}
function raceUpdateCard(M){ const c=$('#rcard'); if(c) c.innerHTML=raceCard(M); }
function raceWalk(M){
  M.phase='run'; raceUpdateCard(M);
  const target = M.k<RACE_N ? RACE_X[M.k]-6 : RACE_META;
  const dist = Math.max(0, target-M.x), ms = Math.max(350, dist*120);
  const r=$('#runner'); if(!r) return;
  r.classList.add('walking'); r.style.transition=`left ${ms}ms linear`;
  requestAnimationFrame(()=>{ r.style.left=target+'%'; });
  M.x=target;
  raceT(M, ()=>{ r.classList.remove('walking'); if(M.k<RACE_N) raceStop(M); else raceMeta(M); }, ms+30);
}
function raceStop(M){
  M.phase='stop'; M.attempts=0; M.status=''; M.statusType=''; M.heard='';
  const ob=$('#ob'+M.k); if(ob) ob.classList.add('next');
  const w=M.items[M.k][1];
  M.say=w;
  raceUpdateCard(M);
  sayP(`Di: ${w}`, ()=>{ if(P && P.m===M && M.phase==='stop' && M.mode!=='manual') raceListen(M, true); });
}
function raceSetStatus(M, txt, type){ M.status=txt; M.statusType=type||''; MUSIC.mute(!!M.listening); raceUpdateCard(M); }
function raceListen(M, auto){
  if(M.phase!=='stop' || M.listening) return;
  TTS.stop();
  if(M.mode==='detect') return raceDetect(M, auto);
  if(!MIC.SR){ M.mode = MIC.hasGUM?'detect':'manual'; return M.mode==='detect'?raceDetect(M):raceUpdateCard(M); }
  const target=M.items[M.k][1];
  let done=false, heard='';
  const r=new MIC.SR();
  r.lang='es-ES'; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
  r.onresult = e=>{
    const alts=[];
    for(let i=e.resultIndex;i<e.results.length;i++) for(let j=0;j<e.results[i].length;j++) alts.push(e.results[i][j].transcript);
    if(alts[0]) heard=alts[0];
    if(!done && speechMatches(target, alts, M.mode)){ done=true; MIC.stopRec(); M.listening=false; raceOK(M,'voice'); }
  };
  r.onerror = e=>{
    if(done) return;
    if(['not-allowed','service-not-allowed','audio-capture','network'].includes(e.error)){
      done=true; M.listening=false; MIC.stopRec();
      if(auto && e.error!=='network' && e.error!=='audio-capture'){ raceSetStatus(M,'Toca el micrófono y di la palabra.'); return; }
      raceMicProblem(M, e.error);
    }
  };
  r.onend = ()=>{ if(done) return; done=true; M.listening=false; MIC.setRec(null); raceMiss(M, heard); };
  MIC.setRec(r);
  try{ r.start(); M.listening=true; raceSetStatus(M,'Te escucho…','listen'); raceT(M, ()=>{ if(!done){ try{ r.stop(); }catch(_){} } }, 9000); }
  catch(err){ M.listening=false; MIC.setRec(null); raceSetStatus(M,'Toca el micrófono y di la palabra.'); }
}
async function raceDetect(M, auto){
  try{ await MIC.open(); }catch(e){ if(auto){ raceSetStatus(M,'Toca el micrófono y di la palabra.'); return; } raceMicProblem(M,'not-allowed'); return; }
  if(!(P && P.m===M && M.phase==='stop')) return;
  M.listening=true; raceSetStatus(M,'Te escucho…','listen');
  let above=0; const t0=Date.now();
  try{
    MIC.meter(lv=>{
      const bar=$('#rlevel'); if(bar) bar.style.width=Math.round(lv*100)+'%';
      if(lv>0.22) above+=16; else above=Math.max(0,above-6);
      if(above>320){ MIC.stopMeter(); M.listening=false; raceOK(M,'voice'); }
      else if(Date.now()-t0>9000){ MIC.stopMeter(); M.listening=false; raceMiss(M,''); }
    });
  }catch(e){ M.listening=false; raceMicProblem(M,'audio-capture'); }
}
function raceMicProblem(M, why){
  const msgs = {'network':'El reconocimiento necesita internet. Ahora basta con que se oiga la voz.', 'not-allowed':'No hay permiso para usar el micrófono. La profesional puede validar con «Bien dicho».', 'service-not-allowed':'El reconocimiento de voz no está disponible aquí. La profesional puede validar con «Bien dicho».', 'audio-capture':'No se encuentra el micrófono. La profesional puede validar con «Bien dicho».'};
  if(why==='network' && MIC.hasGUM) M.mode='detect'; else M.mode='manual';
  raceSetStatus(M, msgs[why]||msgs['service-not-allowed'], 'warn');
  if(M.mode==='detect') raceT(M, ()=>raceListen(M), 1500);
}
function raceMiss(M, heard){
  if(M.phase!=='stop') return;
  M.attempts++; M.heard=heard||'';
  const w=M.items[M.k][1];
  if(P.a.helpAfter>0 && M.attempts>=P.a.helpAfter){
    raceSetStatus(M,'Escucha a Lucía y prueba otra vez.','hint');
    if(P.a.voice) TTS.speak(w, 0.6, ()=>{ if(P && P.m===M && M.phase==='stop') raceSetStatus(M,'Toca el micrófono y prueba otra vez.','hint'); });
  } else {
    raceSetStatus(M, heard ? 'Casi. Toca el micrófono y prueba otra vez.' : 'No te he oído. Toca el micrófono y prueba otra vez.', 'try');
  }
}
function raceSkip(M){
  if(M.phase!=='stop') return;
  MIC.stopAll(); M.listening=false; MUSIC.mute(false); TTS.stop();
  M.phase='jump'; raceUpdateCard(M);
  const r=$('#runner'), land=RACE_X[M.k]+6;
  if(r){ r.style.transition='left 800ms ease-in-out'; r.classList.add('jump'); requestAnimationFrame(()=>{ r.style.left=land+'%'; }); }
  M.x=land;
  raceT(M, ()=>{ if(r) r.classList.remove('jump'); const ob=$('#ob'+M.k); if(ob){ ob.classList.remove('next'); ob.classList.add('cleared'); } M.k++; raceWalk(M); }, 850);
}
function raceOK(M, how){
  if(M.phase!=='stop') return;
  MIC.stopAll(); M.listening=false; MUSIC.mute(false);
  const help = how==='teacher' ? 2 : (M.attempts===0 ? 0 : 1);
  M.words.push({t:M.items[M.k][1], help});
  M.rec.rounds++; if(help===0) M.rec.ok++;
  M.rec.words = M.words;
  M.phase='jump';
  const p=pick(['¡Muy bien!','¡Genial!','¡Salta!','¡Estupendo!']);
  raceUpdateCard(M); $('#rcard .rrun b') && ($('#rcard .rrun b').textContent=p);
  confetti(P.a.calm?10:34); chime(); sayP(p);
  const r=$('#runner'), land=RACE_X[M.k]+6;
  if(r){ r.style.transition='left 800ms ease-in-out'; r.classList.remove('walking'); r.classList.add('jump'); requestAnimationFrame(()=>{ r.style.left=land+'%'; }); }
  M.x=land;
  raceT(M, ()=>{ if(r) r.classList.remove('jump'); const ob=$('#ob'+M.k); if(ob){ ob.classList.remove('next'); ob.classList.add('cleared'); } M.k++; raceWalk(M); }, 850);
}
function raceMeta(M){
  M.phase='done'; M.solved=true; raceCleanup(M);
  if(P.a.tokens) P.tokens=Math.min(P.a.tokens,P.tokens+1);
  const race=$('#race'); if(race && !$('.rmsg',race)) race.insertAdjacentHTML('beforeend','<div class="rmsg">¡Buen trabajo!</div>');
  raceUpdateCard(M); confetti(P.a.calm?14:70); chime();
  sayP('¡Meta! ¡Buen trabajo!');
  const n=$('#nextb'); if(n) n.focus({preventScroll:true});
}
function confetti(n){
  const race=$('#race'), r=$('#runner'); if(!race) return;
  const rb=race.getBoundingClientRect(), pb=r?r.getBoundingClientRect():rb;
  const cx=pb.left-rb.left+pb.width/2, cy=pb.top-rb.top+pb.height/3;
  const cols=['#F2B544','#2F58CD','#E4572E','#34A853','#9B5DE5','#F15BB5','#00BBF9'];
  for(let i=0;i<n;i++){
    const c=document.createElement('i'); c.className='confetti';
    c.style.left=cx+'px'; c.style.top=cy+'px'; c.style.background=cols[i%cols.length];
    c.style.setProperty('--dx',(Math.random()*260-130)+'px'); c.style.setProperty('--dy',(Math.random()*-170+40)+'px'); c.style.setProperty('--r',(Math.random()*720-360)+'deg');
    race.appendChild(c); setTimeout(()=>c.remove(), 1500);
  }
}
GAMES.carrera.act = (M,op,el)=>{
  if(op==='char'){ if(M.phase!=='choose') return; M.char=+el.dataset.i; M.phase='run'; renderPlayer(); const go=()=>{ if(M.started) return; M.started=true; raceWalk(M); }; sayP('¡Preparados, listos, ya!', go); raceT(M, go, 4500); return; }
  if(M.phase!=='stop') return;
  if(op==='hear'){ MIC.stopAll(); M.listening=false; M.status=''; raceUpdateCard(M); TTS.speak(M.items[M.k][1], P.a.rate); }
  else if(op==='mic'){ if(M.listening){ MIC.stopAll(); M.listening=false; raceSetStatus(M,'Toca el micrófono y di la palabra.'); } else raceListen(M); }
  else if(op==='validate') raceOK(M,'teacher');
};

function startGame(gameId, level, sid, own){
  const guest = sid==='guest' || !getStudent(sid);
  const st = guest ? Object.assign(newStudent(), {id:'guest', name:'invitado', avatar:'🙂', av:null}) : getStudent(sid);
  P = {st, a:{...DEF_ADAPT, ...st.adapt}, guest, blocks:[{kind:'mini', game:gameId, level, own:!!own}], b:0, screen:'mini', tokens:0, results:[], skipped:[], minis:[], start:Date.now(), saved:false, free:true};
  if(P.a.music && P.a.music!=='off'){ P.musicOn=true; MUSIC.start(P.a.music); }
  window.scrollTo(0,0); startMini();
}
function gamesOf(s){ return s.games || (s.mini && s.mini.rounds ? [{game:'compra', level:s.mini.level||1, rounds:s.mini.rounds, ok:s.mini.ok}] : []); }

  'edit-student': el=>studentEditor(el.dataset.id, el.dataset.tab||'perfil'),
  'del-student': el=>{ const s=getStudent(el.dataset.id); if(!s) return; confirmBox('Eliminar alumno', `Se borrará el perfil de ${s.name} y todas sus sesiones. No se puede deshacer.`, 'Eliminar', ()=>{ DB.students=DB.students.filter(x=>x.id!==s.id); DB.sessions=DB.sessions.filter(x=>x.studentId!==s.id); save(); render(); toast('Alumno eliminado'); }); },
  'report-student': el=>{ S.view='reports'; S.repSel=el.dataset.id; window.scrollTo(0,0); renderShell(); },
  'act-f': el=>{ S.actF[el.dataset.k]=el.dataset.v; renderShell(); },
  'act-own': ()=>{ S.actF.own=!S.actF.own; renderShell(); },
  preview: el=>previewItem(el.dataset.id),
  'new-item': ()=>itemEditor(null),
  'edit-item': el=>itemEditor(el.dataset.id),
  'dup-item': el=>{ const x=itemById(el.dataset.id); if(!x) return; const c=JSON.parse(JSON.stringify(x)); delete c.id; delete c.builtin; c.q=c.q; itemEditor(null,c); },
  'del-item': el=>confirmBox('Borrar actividad','Esta actividad dejará de aparecer en las sesiones.','Borrar',()=>{ DB.custom=DB.custom.filter(x=>x.id!==el.dataset.id); save(); render(); toast('Actividad borrada'); }),
  'rep-sel': el=>{ S.repSel=el.dataset.id; renderShell(); },
  'apply-level': el=>{ const s=getStudent(el.dataset.id); if(!s) return; s.levels[el.dataset.m]=+el.dataset.lv; save(); renderShell(); toast(`${MODS[el.dataset.m].name}: nivel ${el.dataset.lv}`); },
  'export-csv': el=>{ const s=getStudent(el.dataset.id); saveFile(`progreso-${(s?s.name:'alumno').toLowerCase().replace(/\s+/g,'-')}.csv`, csvFor([el.dataset.id])); },
  'export-csv-all': ()=>saveFile('resultados-aprendiendo-con-lucia.csv', csvFor(DB.students.map(s=>s.id))),
  print: ()=>{ try{ window.print(); }catch(e){ toast('No se puede imprimir desde aquí.'); } },
  note: el=>{ const x=DB.sessions.find(s=>s.id===el.dataset.id); if(!x) return;
    const m=openModal(`<div class="mhead"><h2>Observación de la sesión</h2><button class="iconbtn" data-act="modal-close" aria-label="Cerrar">${ic('x')}</button></div>
      <div class="mbody"><p class="text-sm text-soft mb-2">${fmtDateTime(x.date)}</p><textarea class="input" id="nt" placeholder="Conducta, nivel de atención, apoyos extra, estrategias que han funcionado…">${esc(x.note||'')}</textarea></div>
      <div class="mfoot"><div class="flex-1"></div><button class="btn btn-ghost" data-act="modal-close">Cancelar</button><button class="btn btn-primary" id="nts">Guardar</button></div>`);
    $('#nts',m).onclick=()=>{ x.note=$('#nt',m).value.trim(); save(); closeModal(); renderShell(); toast('Observación guardada'); }; },
  'del-session': el=>confirmBox('Borrar sesión','Se borrarán los resultados de esta sesión.','Borrar',()=>{ DB.sessions=DB.sessions.filter(x=>x.id!==el.dataset.id); save(); renderShell(); }),
  'export-backup': ()=>saveFile(`copia-aprendiendo-con-lucia-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(DB,null,1)),
  wipe: ()=>confirmBox('Borrar todos los datos','Se eliminarán alumnos, actividades propias y sesiones de este dispositivo. Haz antes una copia si la necesitas.','Borrar todo',()=>{ DB=emptyDB(); save(); applyTheme(); S.view='home'; renderShell(); toast('Datos borrados'); }),
  'test-voice': ()=>{ TTS.unlock(); TTS.speak('Hola. Soy Lucía. Así suena la voz del juego.', 0.9, null, ''); },
  'test-voice-st': ()=>{ TTS.unlock(); const m=$('.modal-wrap'); const sel=m&&$('select[name=voiceId]',m); const r=m&&$('input[name=rate]:checked',m); TTS.speak('Hola. Soy Lucía. Así suena esta voz.', r?+r.value:0.85, null, sel?sel.value:''); },

  'p-go': ()=>goBlock(),
  'p-skip': ()=>skipCurrent(),
  'p-agenda': ()=>{ if(P.m) raceCleanup(P.m); TTS.stop(); P.screen='agenda'; renderPlayer(); },
  'p-jump': el=>jumpTo(+el.dataset.b),
  'p-music': ()=>{ P.musicOn=!P.musicOn; if(P.musicOn) MUSIC.start(P.a.music&&P.a.music!=='off'?P.a.music:'calm'); else MUSIC.stop(); renderPlayer(); },
  'p-readopts': ()=>{ TTS.stop(); readOptions(); },
  'p-listen': ()=>{ const q=P.q; q.stopRead=true; sayP(q.it.say||q.it.q, ()=>{ if(P && P.q===q && P.a.read==='no'){ q.stopRead=false; readOptions(); } }); },
  'p-say': el=>sayP(el.dataset.t),
  'p-opt': el=>{ const q=P.q, i=+el.dataset.i; if(q.solved||q.off.includes(i)) return; if(i===q.it.a) solveQuestion(); else { q.off.push(i); wrong(); } },
  'p-place': el=>{ const q=P.q; if(q.solved) return; const o=q.bank.splice(+el.dataset.k,1)[0]; q.placed.push(o); q.fb=''; renderPlayer(); sayP(o.w); },
  'p-unplace': el=>{ const q=P.q; if(q.solved) return; q.bank.push(q.placed.splice(+el.dataset.k,1)[0]); renderPlayer(); },
  'p-clear': ()=>{ const q=P.q; q.bank=q.bank.concat(q.placed); q.placed=[]; renderPlayer(); },
  'p-check': ()=>{ const q=P.q; if(q.placed.map(o=>o.w).join(' ')===q.it.words.join(' ')) solveQuestion(q.it.words.join(' ')); else { q.bank=q.bank.concat(q.placed); q.placed=[]; wrong(); } },
  'p-next': ()=>afterItem(nextQuestion),
  'p-rest-ok': ()=>nextBlock(),
  'p-reward-ok': ()=>{ P.tokens=0; const c=P.after; P.after=null; P.screen = P.m && P.blocks[P.b] && P.blocks[P.b].kind==='mini' ? 'mini' : 'q'; c(); },
  g: (el)=>{ if(!P||!P.m) return; const M=P.m, op=el.dataset.op; if(op==='listen'){ sayP(M.say); return; } if(M.solved && op!=='listen') return; GAMES[M.game].act(M, op, el); },
  'm-next': ()=>afterItem(()=>{ const M=P.m; M.round++; if(M.round<M.total){ resetRound(M); GAMES[M.game].round(M); P.screen='mini'; renderPlayer(); sayP(M.say); } else nextBlock(); }),
  'g-who': el=>{ S.gSel=el.dataset.id; renderShell(); },
  'g-lv': el=>{ S.gLv[el.dataset.g]=+el.dataset.lv; renderShell(); },
  'g-play': el=>{ const id=el.dataset.g, who=getStudent(S.gSel); startGame(id, S.gLv[id] || (who?({...DEF_PLAN,...who.plan}).miniLevel:1), S.gSel, id==='carrera' && S.raceOwn && raceCustomWords().length>0); },
  'race-own': ()=>{ S.raceOwn=!S.raceOwn; renderShell(); },
  'race-words': ()=>{ const m=openModal(`<div class="mhead"><h2>Mis palabras para la carrera</h2><button class="iconbtn" data-act="modal-close" aria-label="Cerrar">${ic('x')}</button></div>
    <div class="mbody"><p class="text-sm text-soft mb-3">Una palabra o frase por línea. Puedes empezar con un emoji para el dibujo. Por ejemplo: <b>🐸 rana</b>, <b>🚗 coche rojo</b>. Ideal para trabajar un fonema concreto.</p><textarea class="input" id="rw-t" style="min-height:220px" placeholder="🐸 rana\n🌹 rosa\n🐭 ratón\n🚗 carro">${esc(DB.settings.raceWords||'')}</textarea></div>
    <div class="mfoot"><div class="flex-1"></div><button class="btn btn-ghost" data-act="modal-close">Cancelar</button><button class="btn btn-primary" id="rw-s">Guardar</button></div>`);
    $('#rw-s',m).onclick=()=>{ DB.settings.raceWords=$('#rw-t',m).value.trim(); save(); S.raceOwn=!!DB.settings.raceWords; closeModal(); renderShell(); toast('Palabras guardadas'); }; }
};
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const fn=ACT[el.dataset.act];
  if(fn){ e.preventDefault(); fn(el,e); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('.modal-wrap')) closeModal(); });
document.addEventListener('input', e=>{
  if(e.target.id==='actq'){ S.actF.q=e.target.value; const pos=e.target.selectionStart; renderShell(); const n=$('#actq'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset && t.dataset.set==='teacher'){ DB.settings.teacher=t.value.trim(); save(); toast('Guardado'); }
  else if(t.dataset && t.dataset.set==='pin'){ const v=t.value.replace(/\D/g,''); if(v && v.length!==4){ toast('El código debe tener 4 cifras'); t.value=DB.settings.pin; return; } DB.settings.pin=v; save(); toast(v?'Código guardado':'Código desactivado'); }
  else if(t.name==='voiceGen' && S.view==='settings' && !t.closest('.modal-wrap')){ DB.settings.voice.uri=t.value; save(); const n=$('#voiceStatus'); if(n) n.textContent=TTS.status(); TTS.unlock(); TTS.speak('Hola. Soy Lucía. Así suena esta voz.', 0.9, null, ''); }
  else if(t.name==='voicePitch' && S.view==='settings' && !t.closest('.modal-wrap')){ DB.settings.voice.pitch=+t.value||1; save(); TTS.unlock(); TTS.speak('Hola. Soy Lucía. Así suena el tono.', 0.9, null, ''); }
  else if(t.name==='theme' && S.view==='settings' && !P && !t.closest('.modal')){ DB.settings.theme=t.value; save(); applyTheme(); }
  else if(t.id==='importFile' && t.files && t.files[0]){
    const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d || d.version!==1 || !Array.isArray(d.students) || !Array.isArray(d.sessions)) throw 0;
      confirmBox('Importar copia', `La copia tiene ${d.students.length} alumnos y ${d.sessions.length} sesiones. Sustituirá los datos actuales de este dispositivo.`, 'Importar', ()=>{ DB=Object.assign(emptyDB(), d, {settings:Object.assign(emptyDB().settings, d.settings||{}), custom:d.custom||[]}); migrate(); save(); applyTheme(); renderShell(); toast('Copia importada'); }, false);
    }catch(err){ toast('El archivo no es una copia válida.'); } };
    r.readAsText(t.files[0]); t.value='';
  }
});
window.addEventListener('beforeunload', ()=>{ if(P) saveSession(true); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && P && !P.guest && (P.results.length||P.minis.some(g=>g.rounds))){ try{ localStorage.setItem(KEY+'-draft', JSON.stringify({studentId:P.st.id, date:P.start, results:P.results, games:P.minis.filter(g=>g.rounds)})); }catch(e){} } });

/* Recuperar una sesión que se quedó a medias */
(function recoverDraft(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY+'-draft'));
    localStorage.removeItem(KEY+'-draft');
    if(d && getStudent(d.studentId) && !DB.sessions.find(s=>s.date===d.date && s.studentId===d.studentId) && (d.results.length || (d.games&&d.games.length))){
      DB.sessions.push({id:uid(), studentId:d.studentId, date:d.date, end:d.date, results:d.results, games:d.games||[], blocks:[...new Set(d.results.map(r=>r.mod))], note:'', early:true}); save();
    }
  }catch(e){}
})();

applyTheme();
render();
</script>
</body>
</html>
